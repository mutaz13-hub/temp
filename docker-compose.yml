services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_public:/var/www/html/public
      - app_storage:/var/www/html/storage

  web:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - app_public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  phpmyadmin:
    image: phpmyadmin:5-apache
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  warehouse_db:
    image: mysql:8.0-debian
    environment:
      MYSQL_DATABASE: warehouse
      MYSQL_USER: warehouse
      MYSQL_PASSWORD: warehouse
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - warehouse_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  warehouse:
    image: node:22-bookworm-slim
    working_dir: /app
    command: node dist/main.js
    volumes:
      - ./warehouse_service:/app
    environment:
      DB_HOST: warehouse_db
      DB_PORT: 3306
      DB_USER: warehouse
      DB_PASSWORD: warehouse
      DB_NAME: warehouse
    depends_on:
      warehouse_db:
        condition: service_healthy
volumes:
  app_public:
  app_storage:
  db_data:
  warehouse_db_data:
